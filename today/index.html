<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#10131c;--ink2:#5b6274;--line:#dfe2ea;--bad:#c23434;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f15;--card:#151821;--ink:#eef0f6;--ink2:#a3aabb;--line:#272c39;--bad:#ff7b7b;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
form{width:100%;max-width:360px;background:var(--card);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line),0 12px 32px -20px rgba(0,0,0,.4)}
h1{margin:0;font:700 26px/1.1 "Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em}
p{margin:0;color:var(--ink2)}
label{font-size:13px;font-weight:600;color:var(--ink2)}
input{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:600 18px ui-monospace,Menlo,monospace;letter-spacing:.04em}
input:focus{outline:2px solid #2a78d6;outline-offset:1px}
button{height:50px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
#err{min-height:20px;color:var(--bad);font-size:14px;font-weight:600}
</style></head>

const KEY='aeb-code';
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
async function unlock(pass){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b(E.salt),iterations:E.iter,hash:'SHA-256'},km,384));
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,b(E.ct)));
  document.open();document.write(html);document.close();
}
if(!window.crypto||!crypto.subtle){$('err').textContent='Open this page over https to unlock it.';}
else{
  let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved)unlock(saved).catch(()=>{try{localStorage.removeItem(KEY)}catch(e){}});
  $('gate').addEventListener('submit',e=>{e.preventDefault();const pw=$('code').value.trim();if(!pw)return;
    $('go').textContent='Opening…';$('err').textContent='';
    unlock(pw).then(()=>{try{localStorage.setItem(KEY,pw)}catch(e){}}).catch(()=>{$('go').textContent='Open the board';$('err').textContent='Wrong code. Try again.';});});
}
